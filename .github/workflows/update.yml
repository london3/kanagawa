name: Update Kanagawa dashboard

on:
  # 毎月1日 00:00 JST = 前日 15:00 UTC
  schedule:
    - cron: "0 15 1 * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "templates/**"
      - "config/**"
      - "docs/assets/**"
      - ".github/workflows/**"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch e-Stat data
        env:
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
        run: python scripts/fetch_estat.py

      - name: Build HTML
        run: python scripts/build_site.py

      - name: Commit updated data and HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/index.html
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: monthly data refresh ($(date -u +'%Y-%m-%d'))"
            git push
          fi
